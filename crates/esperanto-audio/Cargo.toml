[package]
name = "esperanto-audio"
description = "Audio capture backends (microphone, system audio) for Esperanto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cpal = "0.18"
esperanto-core.workspace = true
hound.workspace = true
log = "0.4"
rtrb = "0.4"
rubato = "5"
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
