[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Miguel Diaz"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mdiazn80/esperanto"
rust-version = "1.90"

[workspace.dependencies]
esperanto-core = { path = "crates/esperanto-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2"
esperanto-inference = { path = "crates/esperanto-inference" }
esperanto-audio = { path = "crates/esperanto-audio" }
esperanto-models = { path = "crates/esperanto-models" }
esperanto-speakers = { path = "crates/esperanto-speakers" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
hound = "3"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding (the default) is kept on purpose: the capture thread catches a
# panic and ends the session with an error instead of crashing the app, and
# the local model server is killed on the way out.
strip = true
